<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC880"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1A22"/>
      <stop offset="100%" stop-color="#0A0A0D"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <rect width="100" height="100" rx="24" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  
  <!-- Stylized Barber Straight Razor & Scissors Crest -->
  <g transform="translate(50, 48) scale(0.9)">
    <!-- Razor Blade -->
    <path d="M -24 -18 L 16 -32 C 22 -34 28 -28 26 -22 L 18 2 C 16 8 10 12 4 10 L -24 -2 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round"/>
    <!-- Razor slot -->
    <path d="M -16 -12 L 8 -20 M -12 -6 L -2 -10" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <!-- Handle -->
    <path d="M -24 -2 C -28 8 -26 24 -12 36 C -2 44 14 38 20 28" 
          fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 1"/>
    <!-- Center Monogram 'V' -->
    <text x="0" y="24" font-family="'Cinzel', 'Times New Roman', serif" font-size="28" font-weight="bold" 
          fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">V</text>
  </g>
  
  <!-- Subtle decorative stars -->
  <polygon points="50,14 52,19 57,19 53,22 55,27 50,24 45,27 47,22 43,19 48,19" fill="url(#goldGrad)"/>
</svg>